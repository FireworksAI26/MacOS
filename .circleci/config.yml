version: 2.1

jobs:
  macos-novnc:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium

    steps:
      - checkout

      - run:
          name: Show Mac info
          command: |
            sw_vers
            uname -a
            whoami
            echo "$USER"
            system_profiler SPHardwareDataType || true
            xcodebuild -version

      - run:
          name: Install noVNC, websockify, and cloudflared
          command: |
            brew update
            brew install cloudflared python3

            python3 -m pip install --user websockify

            rm -rf "$HOME/noVNC"
            git clone https://github.com/novnc/noVNC.git "$HOME/noVNC"

      - run:
          name: Enable macOS VNC / Screen Sharing
          command: |
            # macOS VNC legacy passwords should be 8 chars or fewer
            export VNC_PASSWORD="ci123456"

            echo "Using internal VNC password: $VNC_PASSWORD"
            echo "Current user: $USER"

            sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
              -activate \
              -configure \
              -access -on \
              -users "$USER" \
              -privs -all \
              -restart \
              -agent \
              -menu

            sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
              -configure \
              -clientopts \
              -setvnclegacy -vnclegacy yes \
              -setvncpw -vncpw "$VNC_PASSWORD"

            sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
              -restart -agent

            echo "Checking VNC port:"
            lsof -i :5900 || true

      - run:
          name: Create passwordless noVNC launcher
          command: |
            cat > "$HOME/noVNC/index.html" <<'EOF'
            <!doctype html>
            <html>
              <head>
                <meta charset="utf-8">
                <title>CircleCI macOS noVNC</title>
                <style>
                  body {
                    margin: 0;
                    background: #0b1020;
                    color: white;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                    display: flex;
                    min-height: 100vh;
                    align-items: center;
                    justify-content: center;
                    text-align: center;
                  }
                  .box {
                    max-width: 720px;
                    padding: 32px;
                  }
                  a {
                    color: #8ab4ff;
                    font-size: 20px;
                  }
                </style>
              </head>
              <body>
                <div class="box">
                  <h1>Opening CircleCI macOS VM...</h1>
                  <p>If it does not open automatically, click below:</p>
                  <p>
                    <a href="/vnc.html?autoconnect=true&resize=scale&password=ci123456">
                      Open noVNC
                    </a>
                  </p>
                </div>

                <script>
                  window.location.href = "/vnc.html?autoconnect=true&resize=scale&password=ci123456";
                </script>
              </body>
            </html>
            EOF

            echo "Created noVNC launcher page."

      - run:
          name: Start noVNC
          command: |
            export PATH="$HOME/Library/Python/3.*/bin:$PATH"

            nohup python3 -m websockify \
              --web "$HOME/noVNC" \
              6080 \
              localhost:5900 \
              > "$HOME/novnc.log" 2>&1 &

            sleep 5

            echo "Checking noVNC port:"
            lsof -i :6080 || true

            echo "noVNC logs:"
            cat "$HOME/novnc.log" || true

      - run:
          name: Start public Cloudflare tunnel
          command: |
            nohup cloudflared tunnel \
              --url http://localhost:6080 \
              --no-autoupdate \
              > "$HOME/cloudflared.log" 2>&1 &

            echo "Waiting for Cloudflare tunnel URL..."
            sleep 15

            cat "$HOME/cloudflared.log" || true

            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' "$HOME/cloudflared.log" | head -n 1)

            echo ""
            echo "=================================================="
            echo "Open this URL:"
            echo "$TUNNEL_URL"
            echo ""
            echo "Direct noVNC URL:"
            echo "$TUNNEL_URL/vnc.html?autoconnect=true&resize=scale&password=ci123456"
            echo ""
            echo "If it still asks for a password, use:"
            echo "ci123456"
            echo "=================================================="
            echo ""

      - run:
          name: Keep VM alive
          no_output_timeout: 30m
          command: |
            echo "Keeping CircleCI macOS VM alive for noVNC..."
            echo "Stop the job manually when finished."
            while true; do
              date
              sleep 60
            done

workflows:
  test:
    jobs:
      - macos-novnc
