name: macOS noVNC Desktop - M2 Pro Attempt

on:
  workflow_dispatch:

jobs:
  macos-m2-pro:
    name: "Try GitHub macOS xlarge / M2 Pro"
    runs-on: macos-15-xlarge
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Print runner hardware
        run: |
          echo "Hardware:"
          sysctl -n machdep.cpu.brand_string || true
          system_profiler SPHardwareDataType || true
          sw_vers

      - name: Require M2 Pro chip
        run: |
          set -eux

          CHIP_INFO="$(system_profiler SPHardwareDataType || true)"
          echo "$CHIP_INFO"

          if echo "$CHIP_INFO" | grep -qi "M2 Pro"; then
            echo "Confirmed M2 Pro runner."
          else
            echo "This runner is not M2 Pro."
            echo "GitHub did not provide an M2 Pro chip for macos-15-xlarge."
            exit 1
          fi

      - name: List Installed Xcodes
        run: xcodebuild -version && ls /Applications | grep Xcode || true

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install noVNC dependencies
        run: |
          brew update
          brew install novnc websockify cloudflared

      - name: Enable macOS Screen Sharing / VNC
        run: |
          set -eux

          CURRENT_USER="$(whoami)"
          VNC_PASSWORD="$(openssl rand -base64 18 | tr -d '=+/')"

          echo "VNC_USER=$CURRENT_USER" >> "$GITHUB_ENV"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          echo "Current user: $CURRENT_USER"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -users "$CURRENT_USER" \
            -privs -all \
            -restart -agent \
            -menu || true

          sudo defaults write /Library/Preferences/com.apple.VNCSettings.plist VNCLegacyConnectionsEnabled -bool true || true

          echo "Screen Sharing / VNC attempted."

      - name: Start noVNC on port 6080
        run: |
          set -eux

          NOVNC_WEB="/opt/homebrew/share/novnc"

          if [ ! -d "$NOVNC_WEB" ]; then
            NOVNC_WEB="/usr/local/share/novnc"
          fi

          nohup websockify \
            --web="$NOVNC_WEB" \
            6080 \
            localhost:5900 \
            > novnc.log 2>&1 &

          sleep 5

          echo "noVNC started on local port 6080."
          echo "VNC user: $VNC_USER"
          echo "VNC password: $VNC_PASSWORD"

      - name: Create public noVNC tunnel
        run: |
          set -eux

          nohup cloudflared tunnel \
            --url http://localhost:6080 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          sleep 12

          echo "=============================="
          echo "noVNC Desktop Access"
          echo "=============================="

          TUNNEL_URL="$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare.com' cloudflared.log | head -n 1 || true)"

          if [ -z "$TUNNEL_URL" ]; then
            echo "Could not find Cloudflare tunnel URL."
            cat cloudflared.log
            exit 1
          fi

          echo "$TUNNEL_URL/vnc.html"
          echo ""
          echo "VNC host: localhost"
          echo "VNC port: 5900"
          echo "Username: $VNC_USER"
          echo "Password: $VNC_PASSWORD"
          echo "=============================="

      - name: Keep desktop alive
        run: |
          echo "Keeping the noVNC desktop alive for 6 hours..."
          sleep 21600
